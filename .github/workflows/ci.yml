name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finlytics
          POSTGRES_PASSWORD: finlytics_ci
          POSTGRES_DB: finlytics_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finlytics" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://finlytics:finlytics_ci@localhost:5432/finlytics_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
